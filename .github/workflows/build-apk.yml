name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Permitir servidores http
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Ajustes para Android TV
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' $M
          sed -i 's#<application#<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <application android:banner="@mipmap/ic_launcher"#' $M
      - name: Aplicar o ícone do TelaPlay
        run: cp -r android-res/. android/app/src/main/res/
      - name: Usar chave fixa
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: telaplay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
